# Monitor da casa de leilões do WoW: Forever

regiao = "us"
idioma = "en_US"

# Rulesets: 1 = PvP, 2 = Normal, 3 = Roleplay, 15 = Roleplay PvP.
# Qualquer um devolve as 15 casas de todos os rulesets; cada ruleset tem três delas
# (Aliança, Horda, neutra). Pela ordem: 110/113/116 PvP, 111/114/117 Normal,
# 112/115/118 sem uso, 119/120/121 Roleplay, 123/124/125 Roleplay PvP (ver exportar.py).
# Em 10/11/2026 os quatro devolviam exatamente os mesmos anúncios (as casas são
# compartilhadas), então coletar um só já cobre todos.
rulesets = [2]

# Só coleta casas cujo nome contenha um destes textos. Lista vazia = todas
# (Aliança, Horda e a neutra, Blackwater).
filtro_casas = []

banco = "dados/ah.sqlite"
credenciais = "segredos/credenciais.env"

# Fotos brutas guardadas por casa, para reprocessar se a API mudar de formato.
pasta_brutos = "dados/brutos"
brutos_por_casa = 3

# Página de consulta: os JSON vão para <pasta_site>/dados a cada coleta.
pasta_site = "site"
# Horda do ruleset Normal. Quem usa a página pode marcar outra como padrão no próprio navegador.
casa_padrao = 114

# Publicação no GitHub Pages (ramo gh-pages). Vazio = não publica.
# Ex.: "git@github.com:usuario/repositorio.git"
repositorio_pages = "git@github.com:gabrielbadolato/wow-forever-ah.git"
chave_pages = "segredos/pages_deploy_key"
pasta_pages = ".pages"

# Alertas no Discord: regras em alertas.toml; a URL do webhook fica fora do git.
alertas = "alertas.toml"
webhook_discord = "segredos/discord_webhook"
